name: Build desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build macOS app
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release
      - name: Package DMG
        working-directory: app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi
          ./tool/make_dmg.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: app/build/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Windows app
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      - name: Package zip
        working-directory: app
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -like "v*") { $env:GITHUB_REF_NAME.Substring(1) } else { "1.0.0" }
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\RimeUpdater-v$version-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: app/build/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            芝士虎整 · 更新器

            macOS：打开 DMG，把 RimeUpdater.app 拖进「应用程序」。
            首次打开若提示「无法验证开发者」，右键选择「打开」，或到
            「系统设置 → 隐私与安全性」里点「仍要打开」。

            Windows：解压 zip 后运行 `rime_updater.exe`。

            首次启动不会自动联网；点「检查更新」才会请求 GitHub，之后可以
            「仅预演」或「一键更新」。
