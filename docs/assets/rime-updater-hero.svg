<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1280" viewBox="0 0 2560 1280" role="img" aria-labelledby="title desc">
  <title id="title">Rime 更新器</title>
  <desc id="desc">用一张图展示 Rime 更新器的桌面与手机界面：检查方案、预演文件变化、更新与回滚，并管理多个 Rime 目录。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="0.55" stop-color="#eef1ff"/>
      <stop offset="1" stop-color="#f8f8fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7483f0"/>
      <stop offset="1" stop-color="#5362cb"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfe"/>
      <stop offset="1" stop-color="#f5f6fb"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#313b75" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#313b75" flood-opacity="0.19"/>
    </filter>
    <clipPath id="desktopScreen">
      <rect x="1365" y="178" width="930" height="618" rx="22"/>
    </clipPath>
    <clipPath id="phoneScreen">
      <rect x="1111" y="518" width="316" height="584" rx="34"/>
    </clipPath>
  </defs>

  <rect width="2560" height="1280" rx="44" fill="url(#bg)"/>
  <rect x="1" y="1" width="2558" height="1278" rx="43" fill="none" stroke="#dfe4fa" stroke-width="2"/>
  <path d="M0 1015H2560" stroke="#e6e9f7" stroke-width="2"/>
  <path d="M164 1015H710" stroke="#6876de" stroke-width="4"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#202338">
    <g transform="translate(160 172)">
      <rect width="82" height="82" rx="24" fill="url(#accent)"/>
      <path d="M25 58V25h17c11 0 17 5 17 14 0 7-4 11-10 13l12 17H47L37 53h-1v16H25zm11-25v10h6c4 0 6-2 6-5s-2-5-6-5h-6z" fill="#fff"/>
      <path d="M59 18a28 28 0 0 1 9 7" fill="none" stroke="#dce2ff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="270" y="206" font-size="26" font-weight="650" fill="#2a2e43">RIME UPDATER</text>
    <text x="270" y="246" font-size="25" fill="#777d96">通用 Rime 方案管理工具</text>

    <text x="160" y="442" font-size="94" font-weight="760">管理方案，</text>
    <text x="160" y="560" font-size="94" font-weight="760">让每台设备</text>
    <text x="160" y="678" font-size="94" font-weight="760" fill="#5969d5">同步向前。</text>
    <text x="165" y="760" font-size="34" fill="#697089">检查版本 · 预演变更 · 更新与回滚</text>
    <text x="165" y="812" font-size="30" fill="#697089">把多个 Rime 目录和个人数据，放在一处管理。</text>

    <g transform="translate(160 902)">
      <rect width="228" height="56" rx="28" fill="#fff" stroke="#dce1f5" stroke-width="2"/>
      <circle cx="28" cy="28" r="7" fill="#6574df"/>
      <text x="50" y="38" font-size="23" font-weight="600" fill="#48506e">macOS · Windows</text>
      <rect x="244" width="150" height="56" rx="28" fill="#fff" stroke="#dce1f5" stroke-width="2"/>
      <circle cx="272" cy="28" r="7" fill="#6574df"/>
      <text x="294" y="38" font-size="23" font-weight="600" fill="#48506e">Android</text>
      <rect x="410" width="198" height="56" rx="28" fill="#fff" stroke="#dce1f5" stroke-width="2"/>
      <circle cx="438" cy="28" r="7" fill="#6574df"/>
      <text x="460" y="38" font-size="23" font-weight="600" fill="#48506e">iOS 脚本</text>
    </g>
  </g>

